name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

jobs:
  build:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The figures on the manifold and optimizer pages are TikZ sources, compiled here rather than
      # committed as images so that they stay in step with the `.tex` they come from. `xelatex` is
      # texlive-xetex plus texlive-science (for `nicematrix`), `pdftocairo` is poppler-utils. This
      # arrived with the chapters that moved over from GeometricMachineLearning, whose workflow does
      # the same; see `docs/src/tikz/Makefile`.
      - name: Install the TeX toolchain the TikZ figures need
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-science poppler-utils
      - name: Make tikz images
        run: make all -C docs/src/tikz
      - name: Make docs (call julia documenter)
        run: |
          julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
          julia --project=docs --color=yes --threads=2 docs/make.jl
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}